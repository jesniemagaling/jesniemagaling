name: Refresh activity card

on:
  schedule:
    - cron: '17 3 * * *'   # daily, 11:17 Manila time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the activity card
        run: node scripts/build-activity.mjs
        env:
          # A read-only personal token counts private contributions; GITHUB_TOKEN counts public ones.
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/activity-light.svg assets/activity-dark.svg; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/activity-light.svg assets/activity-dark.svg
            git commit -m "chore: refresh activity card"
            git push
          fi
